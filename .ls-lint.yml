# The naming of the files of the repository, checked by the File names job of config.yaml and described in docs/ci-cd.md.
# A file name has no extension rule of its own when it has none at all, such as Dockerfile, LICENSE and CODEOWNERS.
# The rules every folder shares. ls-lint does not merge a folder entry with the rules above it, so every folder entry below
# repeats them through the merge key. Without that, a file such as docs/BadName.md or .github/tools/BadName.sh passes unchecked.
shared: &shared
  # a folder is lowercase words joined by hyphens, and a leading dot marks the folder of a tool. The Next.js router adds a dynamic
  # segment such as [tag], [...slug] or [[...slug]], a private folder that starts with an underscore, a route group such as (site)
  # and a slot such as @modal. The pattern is grouped, because ls-lint puts the anchors around the whole text.
  .dir: regex:(\.?[a-z0-9]+(-[a-z0-9]+)*|\[{1,2}(\.\.\.)?[a-zA-Z0-9_]+\]{1,2}|_[a-z]+|\([a-z0-9-]+\)|@[a-z0-9-]+)

  # every other file is the same, with dots for a variant such as next.config.ts or button.test.tsx
  .*: kebab-case
  .*.*: kebab-case
  .*.*.*: kebab-case

  # the community files in capitals such as README.md and CODE_OF_CONDUCT.md are allowed next to kebab case
  .md: kebab-case | SCREAMING_SNAKE_CASE

# A YAML file ends with .yml, also with more dots in the name such as compose.production.yaml. ls-lint counts the files of one
# folder for an exists rule, so every folder that holds YAML files needs its own entry. Add one here when a new folder gets a
# YAML file.
yaml-ban: &yaml-ban
  .yaml: exists:0
  .*.yaml: exists:0
  .*.*.yaml: exists:0
  .*.*.*.yaml: exists:0

ls:
  <<: [*shared, *yaml-ban]
  .github:
    <<: [*shared, *yaml-ban]
  .github/*:
    <<: [*shared, *yaml-ban]
  .github/*/*:
    <<: [*shared, *yaml-ban]
  .github/*/*/*:
    <<: [*shared, *yaml-ban]
  docs:
    <<: [*shared, *yaml-ban]
  docs/*:
    <<: [*shared, *yaml-ban]
  docs/*/*:
    <<: [*shared, *yaml-ban]

  # a workflow ends with .yaml and not .yml, and the same holds for a name with more dots such as check.config.yml
  .github/workflows:
    <<: *shared
    .yml: exists:0
    .*.yml: exists:0
    .*.*.yml: exists:0
    .yaml: kebab-case

ignore:
  - .git
  - node_modules
  - .next
  - out
  - build
  - coverage
  # GitHub names the issue forms by what the person sees
  - .github/ISSUE_TEMPLATE
  # pre-commit reads this exact name
  - .pre-commit-config.yaml
  # GitHub reads the template by this name
  - .github/pull_request_template.md
